[package]
name = "insar-agent-desktop"
version = "0.1.0"
description = "InSAR-Agent 桌面壳:Tauri 2 窗口 + Python sidecar 生命周期管理"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# 壳的核心逻辑(健康检查 HTTP、诊断页托管)手写在 std 上,不引 reqwest/tokio 等重依赖
# tray-icon feature:系统托盘(src/tray.rs)
tauri = { version = "2", features = ["tray-icon"] }
# 单实例锁(src/singleton.rs):第二实例启动时前置已有窗口
tauri-plugin-single-instance = "2"

# —— 桌面 JS 桥(src/commands.rs)——
# rfd:原生目录选择对话框(异步 API 在独立线程弹窗,不占事件循环)
rfd = "0.15"

# —— 窗口体验(window_state.rs / shortcuts.rs)——
# serde/serde_json:窗口状态 window.json 序列化;app_info 的结构化 JSON
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 全局快捷键(Ctrl+Shift+I 显示/隐藏主窗)
tauri-plugin-global-shortcut = "2"
# 托盘「打开数据目录」:opener 插件按系统关联打开数据目录(src/tray.rs)
tauri-plugin-opener = "2"

# 自动更新(方案见 updater/UPDATER.md):endpoint 只从环境变量
# INSAR_UPDATE_ENDPOINT 读取,未配置则插件不挂载、不做任何更新检查
tauri-plugin-updater = "2"
