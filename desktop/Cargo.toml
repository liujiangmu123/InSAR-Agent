[package]
name = "insar-agent-desktop"
version = "0.1.0"
description = "InSAR-Agent 桌面壳:Tauri 2 窗口 + Python sidecar 生命周期管理"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# 唯一运行时依赖:壳的全部业务(健康检查 HTTP、诊断页托管)手写在 std 上,
# 不引 reqwest/tokio 等重依赖
tauri = { version = "2", features = [] }

# —— 以下为「桌面窗口体验模块」追加(window_state.rs / shortcuts.rs)——
# serde/serde_json:窗口状态 window.json 的序列化(tauri 本就传递依赖它们,
# 这里只是声明为直接依赖以使用 derive)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 全局快捷键(Ctrl+Shift+I 显示/隐藏主窗)——官方 plugin,任务允许的唯一新增
tauri-plugin-global-shortcut = "2"
