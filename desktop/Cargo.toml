[package]
name = "insar-agent-desktop"
version = "0.1.0"
description = "InSAR-Agent 桌面壳:Tauri 2 窗口 + Python sidecar 生命周期管理"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# 唯一运行时依赖:壳的全部业务(健康检查 HTTP、诊断页托管)手写在 std 上,
# 不引 reqwest/tokio 等重依赖
tauri = { version = "2", features = [] }

# —— 桌面 JS 桥新增依赖(src/commands.rs,集成见 INTEGRATION-commands.md)——
# rfd:原生目录选择对话框(异步 API 在独立线程弹窗,不占事件循环)
# serde_json:app_info 返回结构化 JSON(tauri 已传递依赖,显式声明以便直接使用)
rfd = "0.15"
serde_json = "1"
