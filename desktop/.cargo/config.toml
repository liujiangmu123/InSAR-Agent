# 目录级 cargo 配置(仅对 desktop/ 下的 cargo 调用生效):
#
# 1) crates-io → rsproxy(字节跳动国内镜像),使本目录自包含,不依赖
#    用户全局 ~/.cargo/config.toml 是否配置过镜像;
# 2) 显式禁用 HTTP 代理:本机 Windows 系统代理指向 127.0.0.1:7897(本地
#    代理软件),软件没开时 cargo 会自动继承这个死代理导致拉取失败;
#    rsproxy 是国内源,直连即可,任何情况下都不需要代理。

[source.crates-io]
replace-with = "rsproxy-sparse"

[source.rsproxy-sparse]
registry = "sparse+https://rsproxy.cn/index/"

[http]
proxy = ""

[net]
git-fetch-with-cli = true
