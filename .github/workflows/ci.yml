# 主 CI 门禁:python(双平台,非时序组)+ python-timing(时序敏感组,串行独占)。
# 桌面产品是 pi Desktop(overlay),不再编 Tauri,也不跑旧网页前端质检。

name: ci

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, ubuntu-latest ]
    runs-on: ${{ matrix.os }}
    # 子进程测试(五阶段执行器/双超时/取消/reattach)在 Windows 上进程起停慢,
    # 上限给足;若挂死由 job 级超时兜底回收 runner。
    # 其余 Windows 注意点(继承自原 tests.yml 的排障经验):
    # 1) 作业以 DETACHED_PROCESS | CREATE_NEW_PROCESS_GROUP 启动(runtime/jobs.py),
    #    Windows 无 fork、进程起停显著比 Linux 慢,单测阈值与本超时都要放宽;
    # 2) pytest 的 basetemp 已在 pyproject.toml 钉到项目内 .pytest_tmp
    #    (规避 %TEMP% 的 ACL 坑);句柄释放延迟导致的清理 PermissionError 属已知噪声;
    # 3) 若挂死,优先怀疑孤儿子进程未退出——查作业目录 job.pid / job.log,勿盲目重试。
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          # pyproject.toml 的 requires-python >= 3.11:CI 钉下限版本(本地开发在 3.14),
          # 后续要扩就把矩阵加一维 python-version
          python-version: "3.11"

      # 依赖装进项目内虚拟环境(与本地开发约定一致);显式带上 h5py/pyyaml/hypothesis,
      # 与本地门禁环境准备命令保持一字不差
      - name: 建立虚拟环境并安装依赖(Linux)
        if: runner.os == 'Linux'
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e ".[dev,raster]" h5py pyyaml hypothesis

      - name: 建立虚拟环境并安装依赖(Windows)
        if: runner.os == 'Windows'
        run: |
          python -m venv .venv
          .venv\Scripts\python.exe -m pip install --upgrade pip
          .venv\Scripts\python.exe -m pip install -e ".[dev,raster]" h5py pyyaml hypothesis

      # Ubuntu 上 Windows-only 用例依赖 skipif 守护自动跳过(已本地核实清单):
      # - tests/test_chaos_runtime.py::test_no_shared_handle_semantics(仅 win32)
      # - tests/test_wsl_backend.py 的真实 WSL 冒烟(需 win32 + wsl.exe,发行版不可达再跳)
      # - tests/test_wsl_probe.py 按宿主 bash / PowerShell 可用性运行时跳过
      # 时序敏感用例(@pytest.mark.timing)不在本 job 跑:见 python-timing job
      - name: 运行 pytest(Linux,非时序组)
        if: runner.os == 'Linux'
        run: .venv/bin/python -m pytest tests -q --tb=short -p no:warnings -m "not timing"

      - name: 运行 pytest(Windows,非时序组)
        if: runner.os == 'Windows'
        run: .venv\Scripts\python.exe -m pytest tests -q --tb=short -p no:warnings -m "not timing"

  # 时序敏感组(@pytest.mark.timing):判定窗依赖真实时钟(心跳老化/双超时/宽限/
  # 租约/流式收尾),与常规组同 runner 并行会互相拖慢而偶发失败 —— 单独 job 串行
  # 独占 runner 跑(本仓不装 xdist/randomly,pytest 本身即串行;-p no:randomly 是
  # 防未来引入插件的保险栓),叠加 INSAR_TEST_TIME_FACTOR 放宽判定窗,超时上限放宽。
  # 本地并行开发同理:INSAR_TEST_TIME_FACTOR=3(见 README「快速开始」)。
  python-timing:
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, ubuntu-latest ]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45   # 时序组上限放宽(常规 job 30):负载系数会拉长孤儿/超时判定
    env:
      INSAR_TEST_TIME_FACTOR: "2"   # 共享 runner 的调度抖动余量(判定窗×2,语义不变)
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 建立虚拟环境并安装依赖(Linux)
        if: runner.os == 'Linux'
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e ".[dev,raster]" h5py pyyaml hypothesis

      - name: 建立虚拟环境并安装依赖(Windows)
        if: runner.os == 'Windows'
        run: |
          python -m venv .venv
          .venv\Scripts\python.exe -m pip install --upgrade pip
          .venv\Scripts\python.exe -m pip install -e ".[dev,raster]" h5py pyyaml hypothesis

      - name: 运行 pytest(Linux,时序组串行)
        if: runner.os == 'Linux'
        run: .venv/bin/python -m pytest tests -q --tb=short -p no:warnings -p no:randomly -m timing

      - name: 运行 pytest(Windows,时序组串行)
        if: runner.os == 'Windows'
        run: .venv\Scripts\python.exe -m pytest tests -q --tb=short -p no:warnings -p no:randomly -m timing
