# 主 CI 门禁:python(双平台,非时序组)+ python-timing(时序敏感组,串行独占)
# / js(node --test + 前端质检)/ rust(桌面壳)。两组并集 = 全量 pytest。
# 【骨架声明】仓库当前纯本地(无远端),本文件做过 YAML 语法校验,且三个 job 的
# 命令均在本机等价演练通过(pytest / test_js / check 脚本 / clippy / cargo test);
# 首次推上 GitHub 后按真实日志微调(尤其 Windows 侧进程起停耗时)。
# 分工:本文件为 push/PR 门禁,已吸收并取代原 tests.yml(pytest 矩阵并入 python job);
# 桌面发布构建(tag 触发、出 exe 产物)另见 desktop.yml。

name: ci

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, ubuntu-latest ]
    runs-on: ${{ matrix.os }}
    # 子进程测试(五阶段执行器/双超时/取消/reattach)在 Windows 上进程起停慢,
    # 上限给足;若挂死由 job 级超时兜底回收 runner。
    # 其余 Windows 注意点(继承自原 tests.yml 的排障经验):
    # 1) 作业以 DETACHED_PROCESS | CREATE_NEW_PROCESS_GROUP 启动(runtime/jobs.py),
    #    Windows 无 fork、进程起停显著比 Linux 慢,单测阈值与本超时都要放宽;
    # 2) pytest 的 basetemp 已在 pyproject.toml 钉到项目内 .pytest_tmp
    #    (规避 %TEMP% 的 ACL 坑);句柄释放延迟导致的清理 PermissionError 属已知噪声;
    # 3) 若挂死,优先怀疑孤儿子进程未退出——查作业目录 job.pid / job.log,勿盲目重试。
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          # pyproject.toml 的 requires-python >= 3.11:CI 钉下限版本(本地开发在 3.14),
          # 后续要扩就把矩阵加一维 python-version
          python-version: "3.11"

      # 依赖装进项目内虚拟环境(与本地开发约定一致);显式带上 h5py/pyyaml/hypothesis,
      # 与本地门禁环境准备命令保持一字不差
      - name: 建立虚拟环境并安装依赖(Linux)
        if: runner.os == 'Linux'
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e ".[dev,raster]" h5py pyyaml hypothesis

      - name: 建立虚拟环境并安装依赖(Windows)
        if: runner.os == 'Windows'
        run: |
          python -m venv .venv
          .venv\Scripts\python.exe -m pip install --upgrade pip
          .venv\Scripts\python.exe -m pip install -e ".[dev,raster]" h5py pyyaml hypothesis

      # Ubuntu 上 Windows-only 用例依赖 skipif 守护自动跳过(已本地核实清单):
      # - tests/test_chaos_runtime.py::test_no_shared_handle_semantics(仅 win32)
      # - tests/test_wsl_backend.py 的真实 WSL 冒烟(需 win32 + wsl.exe,发行版不可达再跳)
      # - tests/test_wsl_probe.py 按宿主 bash / PowerShell 可用性运行时跳过
      # - tests/test_a11y_dom.py 需 node(GitHub 双平台 runner 均预装)
      # 时序敏感用例(@pytest.mark.timing)不在本 job 跑:见 python-timing job
      - name: 运行 pytest(Linux,非时序组)
        if: runner.os == 'Linux'
        run: .venv/bin/python -m pytest tests -q --tb=short -p no:warnings -m "not timing"

      - name: 运行 pytest(Windows,非时序组)
        if: runner.os == 'Windows'
        run: .venv\Scripts\python.exe -m pytest tests -q --tb=short -p no:warnings -m "not timing"

  # 时序敏感组(@pytest.mark.timing):判定窗依赖真实时钟(心跳老化/双超时/宽限/
  # 租约/流式收尾),与常规组同 runner 并行会互相拖慢而偶发失败 —— 单独 job 串行
  # 独占 runner 跑(本仓不装 xdist/randomly,pytest 本身即串行;-p no:randomly 是
  # 防未来引入插件的保险栓),叠加 INSAR_TEST_TIME_FACTOR 放宽判定窗,超时上限放宽。
  # 本地并行开发同理:INSAR_TEST_TIME_FACTOR=3(见 README「快速开始」)。
  python-timing:
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, ubuntu-latest ]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45   # 时序组上限放宽(常规 job 30):负载系数会拉长孤儿/超时判定
    env:
      INSAR_TEST_TIME_FACTOR: "2"   # 共享 runner 的调度抖动余量(判定窗×2,语义不变)
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 建立虚拟环境并安装依赖(Linux)
        if: runner.os == 'Linux'
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e ".[dev,raster]" h5py pyyaml hypothesis

      - name: 建立虚拟环境并安装依赖(Windows)
        if: runner.os == 'Windows'
        run: |
          python -m venv .venv
          .venv\Scripts\python.exe -m pip install --upgrade pip
          .venv\Scripts\python.exe -m pip install -e ".[dev,raster]" h5py pyyaml hypothesis

      - name: 运行 pytest(Linux,时序组串行)
        if: runner.os == 'Linux'
        run: .venv/bin/python -m pytest tests -q --tb=short -p no:warnings -p no:randomly -m timing

      - name: 运行 pytest(Windows,时序组串行)
        if: runner.os == 'Windows'
        run: .venv\Scripts\python.exe -m pytest tests -q --tb=short -p no:warnings -p no:randomly -m timing

  js:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 零第三方依赖:node 内置 test runner + 纯 stdlib 脚本。
      # check_frontend.py 一键串行跑齐:tests/js/*.test.mjs(node --test)+
      # prototype/*.check.mjs(glob 动态发现,新增自动纳入)+ CSS 语法/断点质检 +
      # a11y 对比度审计(信息性),汇总表输出;任一套件失败即退出非零挡门,
      # 另列 prototype/js 模块「无测试覆盖」警告清单(不阻断)
      - name: 前端质量门(scripts/check_frontend.py 一键跑齐)
        run: python scripts/check_frontend.py

  rust:
    # 与桌面壳目标平台一致用 Windows(在 Linux 上跑 Tauri 需另装 webkit2gtk 等
    # 系统依赖,且本壳的单实例/托盘逻辑以 Windows 为目标),与 desktop.yml 同平台
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Rust 工具链(stable-msvc + clippy)
        run: |
          rustup toolchain install stable-x86_64-pc-windows-msvc --profile minimal --component clippy
          rustup default stable-x86_64-pc-windows-msvc
          rustc --version
          cargo clippy --version

      - name: 缓存 cargo registry 与构建产物
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/target
          # 主键区分本门禁与 desktop.yml 发布构建(debug/release 产物不同),
          # restore-keys 退化到共享前缀,registry 可复用
          key: ${{ runner.os }}-cargo-ci-${{ hashFiles('desktop/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # desktop/.cargo/config.toml 把 crates-io 换成了 rsproxy(服务国内本地开发)。
      # GitHub 托管 runner 直连官方源更快更稳,用 --config(优先级最高)换回官方
      # sparse index,不改仓库内文件(做法与 desktop.yml 一致)。
      - name: cargo check
        run: >-
          cargo check --all-targets
          --config "source.crates-io.replace-with='official'"
          --config "source.official.registry='sparse+https://index.crates.io/'"

      - name: cargo clippy(警告即失败)
        run: >-
          cargo clippy --all-targets
          --config "source.crates-io.replace-with='official'"
          --config "source.official.registry='sparse+https://index.crates.io/'"
          -- -D warnings

      - name: cargo test
        run: >-
          cargo test
          --config "source.crates-io.replace-with='official'"
          --config "source.official.registry='sparse+https://index.crates.io/'"
