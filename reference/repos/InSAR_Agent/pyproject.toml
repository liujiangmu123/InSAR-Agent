[project]
name = "insar-agent"
version = "0.1.0"
description = "InSAR Intelligent Agent - NL-driven InSAR processing with LLM orchestration"
requires-python = ">=3.10"
dependencies = [
    "asf_search>=8.0",
    "hyp3_sdk>=6.0",
    "geopandas>=0.14",
    "rasterio>=1.3",
    "openai>=1.0",
    "shapely>=2.0",
    "matplotlib>=3.8",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.3",
]

[project.scripts]
insar-agent = "insar_agent.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"
