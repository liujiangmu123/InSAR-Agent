<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>InSAR-Agent · 工作区</title>
<style>
:root{
  --bg:#ffffff; --bg-sub:#f7f7f8; --bg-hover:#eef0f2;
  --border:#e5e7eb; --border-strong:#d4d7dc;
  --text:#111827; --text-2:#4b5563; --text-3:#9ca3af;
  --accent:#3b82f6; --accent-weak:#eff6ff; --accent-border:#bfdbfe;
  --ok:#22c55e; --ok-weak:#f0fdf4; --stale:#f97316; --stale-weak:#fff7ed; --bad:#ef4444; --bad-weak:#fef2f2;
  --dark:#0c1e3a;
  --radius:8px; --radius-sm:6px;
  --mono:ui-monospace,'Cascadia Code',Consolas,'SF Mono',monospace;
  --rail:54px; --sider:244px; --drawer:384px; --header:46px;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;color:var(--text);background:var(--bg);font-size:13.5px;line-height:1.6;overflow:hidden}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#d8dbe0;border-radius:5px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea{font-family:inherit}
.hidden{display:none!important}

.app{display:flex;height:100vh}

/* ===== rail ===== */
.rail{width:var(--rail);flex-shrink:0;background:var(--bg-sub);border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;padding:10px 0 12px;gap:2px}
.logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#3b82f6,#1d4ed8);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;letter-spacing:-.5px;margin-bottom:10px;box-shadow:0 2px 8px rgba(59,130,246,.35)}
.rail-btn{width:38px;height:38px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--text-2);position:relative}
.rail-btn:hover{background:var(--bg-hover);color:var(--text)}
.rail-btn.active{background:var(--accent-weak);color:var(--accent)}
.rail-btn svg{width:19px;height:19px}
.rail-btn .dot{position:absolute;top:8px;right:9px;width:7px;height:7px;border-radius:50%;background:var(--stale);border:1.5px solid var(--bg-sub)}
.rail-spacer{flex:1}

/* ===== sider (会话列表) ===== */
.sider{width:var(--sider);flex-shrink:0;background:var(--bg);border-right:1px solid var(--border);display:flex;flex-direction:column}
.sider-head{display:flex;align-items:center;justify-content:space-between;padding:12px 14px 6px}
.sider-head .t{font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--text-3);text-transform:uppercase}
.newchat{width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:var(--text-2)}
.newchat:hover{background:var(--bg-hover)}
.newchat svg{width:16px;height:16px}
.slist{flex:1;overflow-y:auto;padding:2px 8px 8px}
.sitem{display:flex;flex-direction:column;gap:1px;padding:8px 10px;border-radius:8px;cursor:pointer;margin-bottom:1px}
.sitem:hover{background:var(--bg-sub)}
.sitem.active{background:var(--accent-weak)}
.sitem .name{font-size:13px;font-weight:500;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sitem .sub{font-size:11px;color:var(--text-3);display:flex;gap:8px;white-space:nowrap;overflow:hidden}
.sitem .sub .st{display:inline-flex;align-items:center;gap:4px}
.sider-foot{border-top:1px solid var(--border);padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.mode-sw{display:flex;background:var(--bg-sub);border:1px solid var(--border);border-radius:8px;padding:2px;gap:2px}
.mode-sw button{flex:1;padding:5px 0;font-size:12px;color:var(--text-2);border-radius:6px;font-weight:500}
.mode-sw button.on{background:#fff;color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.sider-foot .user{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-2)}
.avatar{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,#0c1e3a,#1e40af);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}

/* ===== main ===== */
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.header{height:var(--header);flex-shrink:0;border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 16px;gap:10px;background:var(--bg)}
.header .title{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.header .title .sep{color:var(--text-3);font-weight:400;margin:0 6px}
.header .sub{font-size:12px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.header .grow{flex:1}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;padding:3px 9px;border-radius:999px;border:1px solid var(--border);color:var(--text-2);white-space:nowrap}
.badge .dot{width:7px;height:7px;border-radius:50%}
.badge.ok{color:var(--ok);border-color:#bbf7d0;background:var(--ok-weak)}
.badge.stale{color:var(--stale);border-color:#fed7aa;background:var(--stale-weak)}
.badge.run{color:var(--accent);border-color:var(--accent-border);background:var(--accent-weak)}
.btn{padding:6px 14px;border-radius:8px;font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn svg{width:14px;height:14px}
.btn.primary{background:var(--accent);color:#fff}
.btn.primary:hover{background:#2563eb}
.btn.primary:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{border:1px solid var(--border);color:var(--text-2);background:#fff}
.btn.ghost:hover{background:var(--bg-sub);color:var(--text)}
.btn.warn{background:var(--stale);color:#fff}
.btn.warn:hover{background:#ea580c}

/* ===== chat ===== */
.chat{flex:1;overflow-y:auto;padding:0 0 8px}
.chat-inner{max-width:820px;margin:0 auto;padding:20px 28px 8px;display:flex;flex-direction:column;gap:16px}

/* hero */
.hero{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:52vh;gap:6px;padding:0 20px}
.hero .logo{width:52px;height:52px;border-radius:14px;font-size:22px;margin-bottom:10px;box-shadow:0 6px 20px rgba(59,130,246,.3)}
.hero h1{font-size:21px;font-weight:700;letter-spacing:-.02em}
.hero p{color:var(--text-2);font-size:13.5px;max-width:480px}
.hero-chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:18px}
.chip{padding:7px 14px;border-radius:999px;border:1px solid var(--border);background:#fff;font-size:12.5px;color:var(--text-2);transition:all .15s}
.chip:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-weak)}
.hero-hint{margin-top:14px;font-size:11.5px;color:var(--text-3)}

/* messages */
.msg{display:flex;gap:10px}
.msg .mav{width:26px;height:26px;border-radius:7px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#fff}
.msg.user{flex-direction:row-reverse}
.msg.user .mav{display:none}
.msg .bubble{max-width:calc(100% - 36px)}
.msg.user .bubble{background:var(--accent);color:#fff;padding:9px 14px;border-radius:14px 14px 3px 14px;font-size:13.5px;line-height:1.55}
.msg.user .bubble .mono{color:#dbeafe}
.msg.agent .bubble{flex:1;min-width:0}
.msg .who{font-size:11.5px;color:var(--text-3);margin-bottom:3px;display:flex;align-items:center;gap:6px}
.msg .who .stamp{margin-left:auto;font-size:10.5px}
.msg.agent .who{color:var(--text-2);font-weight:600}
.msg .text{font-size:13.5px;color:var(--text)}
.msg .text .mono{font-family:var(--mono);font-size:12.5px;background:var(--bg-sub);padding:1px 5px;border-radius:4px}
.msg.thinking .bubble{border-left:2px solid #fbbf24;padding-left:12px;margin-left:2px}
.msg.thinking .text{color:var(--text-2);font-style:italic;font-size:13px}
.msg.thinking .who{color:#b45309}

/* cards */
.card{border:1px solid var(--border);border-radius:var(--radius);background:#fff;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.card+.card{margin-top:10px}
.card-head{display:flex;align-items:center;gap:8px;padding:10px 14px;cursor:pointer;user-select:none}
.card-head:hover{background:var(--bg-sub)}
.card-head .ic{width:20px;height:20px;border-radius:5px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.card-head .ic svg{width:13px;height:13px}
.card-head .t{font-weight:600;font-size:13px}
.card-head .desc{font-size:11.5px;color:var(--text-3);margin-left:2px}
.card-head .grow{flex:1}
.card-head .chev{color:var(--text-3);transition:transform .2s}
.card-head .chev svg{width:14px;height:14px;display:block}
.card.open .card-head .chev{transform:rotate(90deg)}
.card-body{display:none;padding:0 14px 12px;border-top:1px solid var(--border)}
.card.open .card-body{display:block}

/* pipeline card */
.steps{display:flex;flex-direction:column}
.step{display:flex;align-items:center;gap:10px;padding:7px 14px;border-left:3px solid transparent;transition:all .25s}
.step:hover{background:var(--bg-sub)}
.step .snum{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;flex-shrink:0}
.step.pending .snum{background:var(--bg-hover);color:var(--text-3)}
.step.done .snum{background:var(--ok);color:#fff}
.step.running .snum{background:var(--accent);color:#fff;animation:pulse 1.4s infinite}
.step.failed .snum{background:var(--bad);color:#fff}
.step.stale .snum{background:var(--stale);color:#fff}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(59,130,246,.4)}50%{box-shadow:0 0 0 5px rgba(59,130,246,0)}}
.step .sname{font-size:13px;font-weight:500;flex:1}
.step .smeta{font-size:11px;color:var(--text-3);font-family:var(--mono)}
.step .sflag{font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:999px}
.step .sflag.ok{background:var(--ok-weak);color:var(--ok)}
.step .sflag.stale{background:var(--stale-weak);color:var(--stale)}
.step .sflag.run{background:var(--accent-weak);color:var(--accent)}
.step.done{border-left-color:var(--ok)}
.step.stale{border-left-color:var(--stale);background:var(--stale-weak)}
.step.running{border-left-color:var(--accent)}
.stale-shake{animation:staleFlash .6s ease-out}
@keyframes staleFlash{0%{background:#ffedd5}100%{background:var(--stale-weak)}}

/* param / method */
.param{display:flex;align-items:center;gap:10px;padding:8px 14px;border-top:1px solid var(--bg-hover)}
.param .k{font-family:var(--mono);font-size:12.5px;color:var(--text-2);background:var(--bg-sub);padding:2px 7px;border-radius:5px}
.param .v{font-family:var(--mono);font-size:12.5px;color:var(--text);font-weight:600}
.param .grow{flex:1}
.param .edit{font-size:11.5px;color:var(--accent);font-weight:600}
.param .edit:hover{text-decoration:underline}
.cmdline{font-family:var(--mono);font-size:12px;background:#0f172a;color:#e2e8f0;padding:10px 14px;border-radius:7px;margin:10px 14px;overflow-x:auto;white-space:pre;line-height:1.5}
.cmdline .c1{color:#7dd3fc}.cmdline .c2{color:#a5b4fc}.cmdline .c3{color:#86efac}.cmdline .c4{color:#fbbf24}
.cmdline .dim{color:#64748b}

/* candidate card */
.cands{padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.cand{border:1px solid var(--border);border-radius:var(--radius-sm);padding:9px 12px;cursor:pointer;transition:all .15s;display:flex;gap:10px;align-items:flex-start;background:#fff}
.cand:hover{border-color:var(--accent)}
.cand.sel{border-color:var(--accent);background:var(--accent-weak);box-shadow:0 0 0 1px var(--accent)}
.cand .radio{width:15px;height:15px;border-radius:50%;border:1.5px solid var(--border-strong);flex-shrink:0;margin-top:2px;display:flex;align-items:center;justify-content:center}
.cand.sel .radio{border-color:var(--accent)}
.cand.sel .radio::after{content:'';width:7px;height:7px;border-radius:50%;background:var(--accent)}
.cand .m{font-weight:600;font-size:13px;display:flex;align-items:center;gap:7px}
.cand .m .tag{font-size:10px;font-weight:700;padding:1px 6px;border-radius:4px;letter-spacing:.02em}
.cand .m .tag.rec{background:var(--ok-weak);color:var(--ok)}
.cand .m .tag.cur{background:var(--stale-weak);color:var(--stale)}
.cand .why{font-size:12px;color:var(--text-2);margin-top:2px}
.cand .why .mono{font-family:var(--mono);font-size:11.5px;background:var(--bg-sub);padding:0 4px;border-radius:3px}
.candfoot{padding:10px 14px;border-top:1px solid var(--bg-hover);display:flex;align-items:center;gap:10px;background:var(--bg-sub)}

/* evidence / provenance */
.prov-tree{font-family:var(--mono);font-size:12px;padding:10px 14px;display:flex;flex-direction:column;gap:4px;color:var(--text-2);overflow-x:auto}
.prov-tree .row{display:flex;gap:8px;align-items:center;white-space:nowrap}
.prov-tree .row .k{color:var(--text-3);min-width:64px}
.prov-tree .row .v{color:var(--text)}
.prov-tree .row .hl{color:var(--accent)}
.ladder{display:flex;padding:12px 14px;gap:4px}
.ladder .lv{flex:1;text-align:center;font-size:10px;font-weight:700;padding:5px 0;border-radius:5px;color:var(--text-3);background:var(--bg-sub);border:1px solid var(--border)}
.ladder .lv.on{color:var(--ok);border-color:#bbf7d0;background:var(--ok-weak)}

/* result */
.res-body{padding:12px 14px}
.fig{border:1px solid var(--border);border-radius:var(--radius-sm);overflow:hidden;background:#fff}
.fig .figbar{display:flex;align-items:center;gap:8px;padding:7px 12px;border-bottom:1px solid var(--border);background:var(--bg-sub);font-size:11.5px;color:var(--text-2)}
.fig .figbar .mono{font-family:var(--mono);margin-left:auto;font-size:10.5px;color:var(--text-3)}
.fig svg{display:block;width:100%;height:auto}
.metrics{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.metric{flex:1;min-width:120px;border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 12px}
.metric .mv{font-size:16px;font-weight:700;font-family:var(--mono)}
.metric .mk{font-size:11px;color:var(--text-3)}
table.tbl{width:100%;border-collapse:collapse;font-size:12px;margin-top:10px}
table.tbl th,table.tbl td{padding:6px 10px;border-bottom:1px solid var(--bg-hover);text-align:left}
table.tbl th{color:var(--text-3);font-weight:600;font-size:11px}
table.tbl .mono{font-family:var(--mono);font-size:11.5px}
table.tbl td.ck{cursor:pointer;transition:background .12s}
table.tbl tr.ck:hover td{background:var(--accent-weak)}
.xval{display:flex;align-items:center;gap:8px;margin-top:10px;padding:9px 12px;border-radius:var(--radius-sm);background:var(--ok-weak);border:1px solid #bbf7d0;font-size:12.5px;color:#15803d}
.xval .big{font-family:var(--mono);font-weight:700;font-size:15px}

/* banner */
.banner{margin:2px 0;padding:9px 14px;border-radius:var(--radius);font-size:12.5px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.banner.stale{background:var(--stale-weak);border:1px solid #fed7aa;color:#9a3412}
.banner.ok{background:var(--ok-weak);border:1px solid #bbf7d0;color:#15803d}
.banner.info{background:var(--accent-weak);border:1px solid var(--accent-border);color:#1d4ed8}
.banner .grow{flex:1}

/* confirm card */
.confirm{border:1px solid #fed7aa;background:var(--stale-weak)}
.confirm .q{padding:10px 14px;font-size:13px;font-weight:600}
.confirm .preview{padding:0 14px 10px;display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--text-2)}
.confirm .preview .row{display:flex;gap:8px}
.confirm .preview .row .k{min-width:70px;color:var(--text-3)}
.confirm .preview .row .v{font-family:var(--mono);color:var(--text)}
.confirm .acts{display:flex;gap:8px;padding:10px 14px;border-top:1px solid #fed7aa}

/* input bar */
.inputbar{border-top:1px solid var(--border);background:var(--bg);flex-shrink:0;padding:12px 20px 14px}
.input-shell{max-width:820px;margin:0 auto}
.input-box{display:flex;align-items:flex-end;gap:8px;border:1px solid var(--border-strong);border-radius:12px;padding:8px 8px 8px 14px;background:#fff;transition:border-color .15s,box-shadow .15s}
.input-box:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(59,130,246,.12)}
.input-box textarea{flex:1;border:none;outline:none;resize:none;font-size:13.5px;line-height:1.5;max-height:120px;padding:6px 0;color:var(--text);background:transparent}
.input-box textarea::placeholder{color:var(--text-3)}
.ibtn{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--text-3);flex-shrink:0}
.ibtn:hover{background:var(--bg-sub);color:var(--text-2)}
.ibtn.send{background:var(--accent);color:#fff;width:34px;height:34px}
.ibtn.send:hover{background:#2563eb}
.ibtn.send:disabled{opacity:.4;cursor:not-allowed}
.ibtn svg{width:16px;height:16px}
.input-hint{display:flex;align-items:center;gap:12px;margin-top:7px;font-size:11px;color:var(--text-3);padding:0 4px}
.input-hint .keys{font-family:var(--mono);font-size:10.5px}

/* ===== drawer ===== */
.drawer{width:var(--drawer);flex-shrink:0;background:var(--bg-sub);border-left:1px solid var(--border);display:none;flex-direction:column}
.drawer.on{display:flex}
.drawer-tabs{display:flex;padding:8px 6px 0;gap:1px;border-bottom:1px solid var(--border);background:var(--bg)}
.drawer-tabs button{flex:1;padding:7px 3px;font-size:11.5px;color:var(--text-2);border-radius:7px 7px 0 0;font-weight:500;display:flex;align-items:center;justify-content:center;gap:4px;border-bottom:2px solid transparent;white-space:nowrap}
.drawer-tabs button.on{color:var(--text);font-weight:600;border-bottom-color:var(--accent)}
.drawer-tabs button svg{width:13px;height:13px;flex-shrink:0}
.drawer-tabs button .cnt{font-size:10px;background:var(--bg-hover);padding:0 5px;border-radius:999px;color:var(--text-2)}
.drawer-tabs button.on .cnt{background:var(--accent-weak);color:var(--accent)}
.drawer-body{flex:1;overflow-y:auto;padding:12px}
.dsec{font-size:11px;font-weight:700;color:var(--text-3);letter-spacing:.05em;margin:14px 0 6px;display:flex;align-items:center;gap:8px}
.dsec:first-child{margin-top:0}
.dsec::after{content:'';flex:1;height:1px;background:var(--border)}
.dlist{display:flex;flex-direction:column;gap:2px}
.ditem{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:7px;font-size:12.5px;color:var(--text);cursor:pointer}
.ditem:hover{background:var(--bg-hover)}
.ditem .ic{color:var(--text-3);display:flex}
.ditem .ic svg{width:15px;height:15px}
.ditem .name{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ditem .meta{font-size:10.5px;color:var(--text-3);font-family:var(--mono)}
.ditem .hash{font-family:var(--mono);font-size:10px;color:var(--text-3);background:var(--bg-hover);padding:1px 6px;border-radius:4px}
.ditem .st{width:8px;height:8px;border-radius:50%}
.mapbox{border:1px solid var(--border);border-radius:var(--radius-sm);overflow:hidden;background:#fff}
.mapbox svg{display:block;width:100%}
.maplay{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.maplay .ly{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:6px 9px;border-radius:7px;cursor:pointer}
.maplay .ly:hover{background:var(--bg-hover)}
.maplay .ly .sw{width:30px;height:16px;border-radius:999px;background:var(--border-strong);position:relative;transition:background .2s;flex-shrink:0}
.maplay .ly.on .sw{background:var(--accent)}
.maplay .ly .sw::after{content:'';position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:#fff;transition:left .2s}
.maplay .ly.on .sw::after{left:16px}
.maplay .ly .t{flex:1}
.maplay .ly .h{font-size:10.5px;color:var(--text-3)}
.timeline{display:flex;align-items:center;gap:6px;margin-top:12px}
.timeline .bar{flex:1;height:4px;border-radius:2px;background:linear-gradient(to right,#dbeafe 0 20%,#93c5fd 20% 40%,#60a5fa 40% 60%,#3b82f6 60% 80%,#2563eb 80% 100%);position:relative}
.timeline input[type=range]{position:absolute;inset:0;width:100%;opacity:0;cursor:pointer;margin:0}
.timeline .dt{font-size:10.5px;color:var(--text-3);font-family:var(--mono);min-width:86px;text-align:right}

/* ===== gallery / images ===== */
.gal{display:flex;flex-direction:column;gap:8px}
.gal-item{border:1px solid var(--border);border-radius:7px;background:#fff;overflow:hidden;cursor:pointer;transition:border-color .15s,box-shadow .15s}
.gal-item:hover{border-color:var(--accent);box-shadow:0 1px 5px rgba(59,130,246,.18)}
.gal-item .gbar{display:flex;align-items:center;gap:7px;padding:6px 10px;border-bottom:1px solid var(--border);background:var(--bg-sub);font-size:11.5px;color:var(--text-2)}
.gal-item .gbar .mono{font-family:var(--mono);margin-left:auto;font-size:10px;color:var(--text-3)}
.gal-item .gbar .exp{color:var(--text-3);display:flex;transition:color .15s}
.gal-item:hover .gbar .exp{color:var(--accent)}
.gal-item .gbar .exp svg{width:13px;height:13px}
.gal-item .gbody{padding:8px}
.gal-item .gbody svg{display:block;width:100%;height:auto;border-radius:4px}
.gal-item .gdesc{padding:7px 10px;font-size:11.5px;color:var(--text-2);border-top:1px solid var(--bg-hover)}
.gal-item .gdesc .tag{font-size:10px;font-weight:700;padding:1px 6px;border-radius:4px;background:var(--ok-weak);color:var(--ok);margin-right:6px}
.gal-item .gdesc .tag.stale{background:var(--stale-weak);color:var(--stale)}

/* map view + points */
.mapview{border:1px solid var(--border);border-radius:7px;background:#fff;overflow:hidden}
.mapview .mv-tool{display:flex;align-items:center;gap:6px;padding:6px 10px;border-bottom:1px solid var(--border);background:var(--bg-sub);font-size:11.5px;color:var(--text-2);flex-wrap:wrap}
.mapview .mv-tool .mono{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--text-3)}
.pointchip{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;padding:2px 8px;border-radius:999px;border:1px solid var(--border);cursor:pointer;color:var(--text-2);background:#fff}
.pointchip.on{border-color:var(--accent);background:var(--accent-weak);color:var(--accent);font-weight:600}
.mapbox .pt{cursor:pointer}
.mapbox .pt circle{fill:#fff;stroke:#0c1e3a;stroke-width:2.5}
.mapbox .pt:hover circle{fill:var(--accent)}
.mapbox .pt.on circle{fill:var(--accent);stroke:var(--dark)}
.mapbox .pt.on text{font-weight:700}
.ts-card{border:1px solid var(--border);border-radius:7px;background:#fff;padding:10px 12px;margin-top:8px}
.ts-card .ts-head{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;margin-bottom:4px}
.ts-card .ts-head .mono{font-family:var(--mono);font-weight:400;font-size:10.5px;color:var(--text-3);margin-left:auto}
.ts-card svg{display:block;width:100%;height:auto}
.ts-card .ts-stats{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.ts-card .ts-stats .tsv{font-size:11px;border:1px solid var(--border);border-radius:6px;padding:4px 9px;color:var(--text-2);background:var(--bg-sub)}
.ts-card .ts-stats .tsv b{font-family:var(--mono);font-size:12px;color:var(--text)}

/* file preview */
.filepre{background:#fff;border:1px solid var(--border);border-radius:7px;overflow:hidden;margin-top:10px}
.filepre .fp-bar{display:flex;align-items:center;gap:8px;padding:7px 11px;border-bottom:1px solid var(--border);background:var(--bg-sub);font-size:12px;font-weight:600}
.filepre .fp-bar .mono{font-family:var(--mono);font-weight:400;font-size:10.5px;color:var(--text-3);margin-left:auto}
.filepre .fp-bar .ro{font-size:10px;font-weight:700;color:var(--text-3);background:var(--bg-hover);padding:1px 7px;border-radius:999px}
.filepre pre{font-family:var(--mono);font-size:11.5px;line-height:1.65;padding:11px 13px;overflow-x:auto;color:var(--text-2);white-space:pre;margin:0}
.filepre pre .hl2{color:var(--accent);font-weight:600}
.filepre pre .cm{color:var(--text-3)}
.filepre .fp-img{padding:10px}
.filepre .fp-img svg{display:block;width:100%;height:auto;border-radius:4px}
.filepre .fp-meta{display:flex;gap:6px;flex-wrap:wrap;padding:0 12px 10px}
.filepre .fp-meta .mv{font-size:10.5px;color:var(--text-3);background:var(--bg-sub);border:1px solid var(--border);padding:2px 8px;border-radius:999px}
.filepre .fp-empty{padding:26px 14px;text-align:center;font-size:12px;color:var(--text-3)}

/* browser mock */
.brow{display:flex;flex-direction:column;background:#fff;border:1px solid var(--border);border-radius:7px;overflow:hidden}
.brow .baddr{display:flex;align-items:center;gap:6px;padding:7px 10px;border-bottom:1px solid var(--border);background:var(--bg-sub)}
.brow .baddr .dot{width:9px;height:9px;border-radius:50%;background:#fca5a5;flex-shrink:0}
.brow .baddr .dot:nth-child(2){background:#fcd34d}
.brow .baddr .dot:nth-child(3){background:#86efac}
.brow .baddr input{flex:1;border:1px solid var(--border);border-radius:6px;background:#fff;padding:5px 10px;font-size:11.5px;font-family:var(--mono);outline:none;color:var(--text);min-width:0}
.brow .baddr input:focus{border-color:var(--accent)}
.brow .baddr .go{width:24px;height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--text-2);background:var(--bg-hover);flex-shrink:0}
.brow .baddr .go:hover{color:var(--accent)}
.brow .bmarks{display:flex;gap:6px;padding:8px 12px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.brow .bmarks .bm{font-size:11px;padding:4px 10px;border-radius:999px;border:1px solid var(--border);cursor:pointer;color:var(--text-2);background:#fff}
.brow .bmarks .bm:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-weak)}
.brow .bpage{font-size:12px}
.brow .bpage .bp-top{background:linear-gradient(135deg,#0c1e3a,#1e40af);color:#fff;padding:14px 16px}
.brow .bpage .bp-top .h{font-size:14px;font-weight:700}
.brow .bpage .bp-top .s{font-size:11px;color:#bfdbfe;margin-top:2px}
.brow .bpage .bp-tools{display:flex;gap:6px;padding:8px 12px;border-bottom:1px solid var(--bg-hover);flex-wrap:wrap}
.brow .bpage .bp-tools .tk{font-size:10.5px;padding:3px 9px;border-radius:999px;border:1px solid var(--border);color:var(--text-2)}
.brow .bpage .bp-res{padding:10px 12px;display:flex;flex-direction:column;gap:7px}
.brow .bpage .bp-res .r{border:1px solid var(--bg-hover);border-radius:6px;padding:8px 11px;font-size:11.5px;color:var(--text-2);background:#fff}
.brow .bpage .bp-res .r b{color:var(--text);font-size:12px;display:block}
.brow .bpage .bp-res .r .m{font-family:var(--mono);font-size:10px;color:var(--text-3);margin-top:2px}
.brow .bpage .bp-placeholder{padding:30px 16px;text-align:center;color:var(--text-3);font-size:11.5px;line-height:1.8}

/* lightbox */
.lightbox{position:fixed;inset:0;background:rgba(10,15,28,.95);z-index:150;display:none;flex-direction:column;color:#e2e8f0;padding:16px 22px}
.lightbox.on{display:flex}
.lb-top{display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.lb-top .t{font-size:14px;font-weight:600}
.lb-top .sub{font-size:11.5px;color:#94a3b8}
.lb-top .grow{flex:1}
.lb-body{flex:1;display:flex;align-items:center;justify-content:center;overflow:auto;min-height:0;padding:8px 0}
.lb-body svg{max-width:100%;max-height:100%;background:#fff;border-radius:8px;box-shadow:0 12px 40px rgba(0,0,0,.5)}
.lb-acts{display:flex;gap:8px;margin-top:12px}
.lb-acts .btn{color:#0f172a}

/* ===== overlay ===== */
.overlay{position:fixed;inset:0;background:rgba(10,15,28,.94);z-index:100;display:flex;flex-direction:column;color:#e2e8f0}
.ov-top{display:flex;align-items:center;gap:12px;padding:14px 22px;border-bottom:1px solid rgba(255,255,255,.12)}
.ov-top .t{font-size:14px;font-weight:600}
.ov-top .sub{font-size:12px;color:#94a3b8}
.ov-top .grow{flex:1}
.ov-stepper{display:flex;padding:14px 22px 0;gap:4px;overflow-x:auto}
.ov-step{display:flex;align-items:center;gap:6px;font-size:11px;color:#64748b;white-space:nowrap;padding:4px 8px;border-radius:6px}
.ov-step .n{width:16px;height:16px;border-radius:50%;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;font-size:9px}
.ov-step.done{color:#86efac}.ov-step.done .n{background:rgba(34,197,94,.25)}
.ov-step.run{color:#7dd3fc;background:rgba(59,130,246,.15)}.ov-step.run .n{background:rgba(59,130,246,.4);animation:pulse 1.4s infinite}
.ov-step.wait{color:#64748b}
.ov-log{flex:1;overflow-y:auto;padding:16px 22px;font-family:var(--mono);font-size:12px;line-height:1.7}
.ov-log .ln{white-space:pre-wrap;word-break:break-all}
.ov-log .ln.t{color:#64748b}
.ov-log .ln.c{color:#86efac}
.ov-log .ln.w{color:#fbbf24}
.ov-log .ln.e{color:#f87171}
.ov-log .ln.s{color:#7dd3fc}
.ov-bottom{display:flex;align-items:center;gap:14px;padding:14px 22px;border-top:1px solid rgba(255,255,255,.12)}
.ov-bar{flex:1;height:5px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden}
.ov-bar i{display:block;height:100%;width:0%;background:linear-gradient(90deg,#3b82f6,#22c55e);transition:width .3s}
.ov-pct{font-family:var(--mono);font-size:12px;color:#94a3b8;min-width:44px;text-align:right}
.ov-close{background:rgba(255,255,255,.1);color:#e2e8f0;padding:6px 14px;border-radius:8px;font-size:12px;display:flex;align-items:center;gap:6px}
.ov-close:hover{background:rgba(255,255,255,.2)}
.ov-close svg{width:13px;height:13px}

/* typing */
.typing{display:inline-flex;gap:4px;padding:4px 2px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--text-3);animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.fadein{animation:fadein .35s ease-out}
@keyframes fadein{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

@media (max-width:1100px){.sider{display:none}.drawer{position:absolute;right:0;top:0;bottom:0;z-index:50;box-shadow:-8px 0 24px rgba(0,0,0,.08)}}
</style>
</head>

<script>
/* ============ 数据 ============ */
const STEPS=[
 {id:1, name:'数据获取',  cmd:'fetch_stack.py --site yushu --dates 2020-01..2023-12 --platform sentinel-1', dur:'6m', meta:'46 景 SLC'},
 {id:2, name:'辅助数据',  cmd:'dem.py --download copernicus-30m --region yushu ; orbits.py --precise', dur:'2m', meta:'DEM + 精密轨道'},
 {id:3, name:'配准',      cmd:'isce2 topo_rslc.py --stack config.yaml', dur:'18m', meta:'46 景'},
 {id:4, name:'干涉',      cmd:'isce2 interferogram.py --method tops', dur:'52m', meta:'1,035 对'},
 {id:5, name:'滤波',      cmd:'isce2 filter.py --goldstein 0.4', dur:'31m', meta:'γ 均值 0.62'},
 {id:6, name:'解缠',      cmd:'mintpy unwrap --method 3D_FULL', dur:'24m', meta:'unwrap_method=3D_FULL', method:'3D_FULL', cand:true},
 {id:7, name:'时序反演',  cmd:'mintpy_sbas.py --unw 3D_FULL_out --update', dur:'38m', meta:'mintpy_sbas'},
 {id:8, name:'误差校正',  cmd:'mintpy remove_ramp --troposphere --ionosphere', dur:'9m', meta:'std 降 32%'},
 {id:9, name:'形变模型',  cmd:'mintpy timeseries2velocity --model poly_periodic', dur:'7m', meta:'poly_periodic'},
 {id:10,name:'出图导出',  cmd:'mintpy save_gbis --gbis figs/*.pdf', dur:'4m', meta:'期刊级图表'},
 {id:11,name:'质检',      cmd:'crossval_ps_sbas.py --ref ps_chain --corr 0.85', dur:'11m', meta:'PS/SBAS 交叉验证'},
];
const CANDIDATES=[
 {m:'MCF', tag:'推荐', tagc:'rec', why:'Minimum Cost Flow。Sentinel-1 冻土低相干区稳健，与 MintPy 原生兼容，下游 poly_periodic 模型直接可用。', extra:'耗时 ~24m，内存 8G'},
 {m:'SNAPHU', tag:'备选', tagc:'', why:'精度更高但需外部启动参数，冰/冻土区需人工调 cost function，难以全自动。', extra:'耗时 ~40m，需交互配置'},
 {m:'3D_FULL', tag:'当前', tagc:'cur', why:'当前配置。本机无 3D 相位解缠工具链，且输出格式与下游时序反演不兼容。', extra:'状态：不可用'},

function stepRow(st,{compact=false}={}){
 const status = st.stale?'stale':st.state||'pending';
 const flag = st.stale?'<span class="sflag stale">STALE</span>'
   : st.state==='running'?'<span class="sflag run">运行中</span>'
   : st.state==='failed'?'<span class="sflag" style="background:var(--bad-weak);color:var(--bad)">失败</span>'
   : st.state==='done'?'<span class="sflag ok">✓ 有效</span>':'';
 return `<div class="step ${status}" data-step="${st.id}"><span class="snum">${st.state==='done'?'✓':st.stale?'!':st.id}</span><span class="sname">${st.id}. ${st.name}${st.method?' <span style="font-size:11px;color:var(--text-3);font-family:var(--mono)">'+st.method+'</span>':''}</span><span class="smeta">${compact?'':st.meta}</span>${flag}</div>`;
}

 return c;
}
function setStepState(id,state){
 const s=STEPS.find(x=>x.id===id); if(!s)return; s.state=state;
 document.querySelectorAll(`[data-step="${id}"]`).forEach(r=>{
  r.className='step '+((state==='done')?'done':state==='running'?'running':state==='failed'?'failed':'pending');
  const n=r.querySelector('.snum'); n.textContent=state==='done'?'✓':s.stale?'!':id;
  if(state==='done'){r.innerHTML=stepRow(s,{compact:true})}
  else if(state==='running'){if(!r.querySelector('.sflag.run'))r.innerHTML=stepRow(s,{compact:true})}
 });
 refreshDrawer();
}

  <span class="tsv">年均速率 <b style="color:${p.rate<0?'var(--bad)':'var(--accent)'}">${p.rate!==null?p.rate+' mm/yr':'对照'}</b></span>
  ${p.std!==null?`<span class="tsv">不确定度 <b>±${p.std}</b></span>`:''}
  <span class="tsv">时序点数 <b>${p.ts.length}</b></span>
  ${p.ref?'<span class="tsv">用于 GNSS 校验 <b>✓</b></span>':''}
 </div></div>`;
}
function showLightbox(id){
 const g=IMAGES.find(x=>x.id===id); if(!g)return;
 $('lbTitle').textContent=g.name;
 $('lbSub').textContent=g.t+' · '+g.meta+' · '+g.hash;
 $('lbBody').innerHTML=imgSvg(id);
 $('lbOpenRight').dataset.img=id;
 $('lightbox').classList.add('on');
}
function openDrawer(tab,view){
 const d=$('drawer'); if(!d.classList.contains('on')) d.classList.add('on');
 S.drawer=tab; S.view=view||null; renderDrawer();
}
function renderFilePreview(name){
 const f=FILES.find(x=>x.name===name); const fc=FILECONTENTS[name];
 if(!fc)return `<div class="filepre"><div class="fp-bar">${esc(name)}<span class="ro">只读</span></div><div class="fp-empty">目录或二进制产物，此处仅展示元数据。<br><br>哈希 ${f?f.hash:'—'} · ${f?f.meta:''}</div></div>`;
 const meta=`<span class="mono">${f?f.meta:''}</span>`;
 const st=`<span class="mv">${f&&f.stale?'STALE · 待重跑':'有效'}</span>`;
 if(fc.type==='img')return `<div class="filepre fadein"><div class="fp-bar">${esc(name)}${meta}<span class="ro">只读预览</span></div><div class="fp-img">${imgSvg(fc.img)}</div><div class="fp-meta"><span class="mv">${f?f.hash:''}</span><span class="mv">SHA256 指纹</span>${st}<span class="mv" style="cursor:pointer;color:var(--accent)" onclick="showLightbox('${fc.img}')">全屏查看 →</span></div></div>`;
 const rows=fc.rows.map(r=>{const o=r[1]==='cm'?'<span class="cm">':r[1]==='hl2'?'<span class="hl2">':'';const c=o?'</span>':'';return o+esc(r[0])+c}).join('\n');
 return `<div class="filepre fadein"><div class="fp-bar">${esc(name)}${meta}<span class="ro">只读</span></div><pre>${rows}</pre><div class="fp-meta"><span class="mv">${f?f.hash:''}</span><span class="mv">UTF-8 · LF</span>${st}</div></div>`;
}
function renderBrowser(){
 const cur=S.view&&S.view.site?S.view.site:'asf'; const s=BROWSER_SITES[cur];
 const url={'asf':'https://search.asf.alaska.edu','esa':'https://earth.esa.int','lit':'https://scholar.google.com'}[cur];
 return `<div class="brow fadein">
  <div class="baddr"><span class="dot"></span><span class="dot"></span><span class="dot"></span><input id="bUrl" value="${url}" spellcheck="false"><button class="go" id="bGo" title="打开"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6M15 3h6v6M10 14L21 3"/></svg></button></div>
  <div class="bmarks">${Object.keys(BROWSER_SITES).map(k=>`<span class="bm ${k===cur?'on':''}" data-site="${k}" style="${k===cur?'border-color:var(--accent);color:var(--accent);background:var(--accent-weak)':''}">${k==='asf'?'ASF 数据源':k==='esa'?'ESA 政策':'文献检索'}</span>`).join('')}</div>
  <div class="bpage">
   <div class="bp-top"><div class="h">${s.h}</div><div class="s">${s.s}</div></div>
   <div class="bp-tools">${s.tools.map(t=>`<span class="tk">${t}</span>`).join('')}</div>
   <div class="bp-res">${s.res.map(r=>`<div class="r"><b>${r.t}</b>${r.m?`<div class="m">${r.m}</div>`:''}</div>`).join('')}</div>
  </div>
 </div>`;
}

/* ============ 右侧面板 ============ */
function refreshDrawer(){ if(S.drawer) renderDrawer() }
function renderDrawer(){
 const tab=S.drawer||'pipeline';
 const b=$('drawerBody');
 if(tab==='pipeline'){
  b.innerHTML=`<div class="dsec">处理流水线 · 11 步</div><div class="dlist">${STEPS.map(s=>`<div class="ditem"><span class="st" style="background:${s.stale?'var(--stale)':s.state==='done'?'var(--ok)':s.state==='running'?'var(--accent)':'var(--border-strong)'}"></span><span class="name">${s.id}. ${s.name}</span><span class="meta">${s.stale?'STALE':s.state==='done'?'✓':s.meta||''}</span></div>`).join('')}</div>
  <div class="dsec">失效传播</div><div class="ditem" style="cursor:default;font-size:12px;color:var(--text-2)">改动上游参数 → 指纹检测 → 级联标记下游 STALE，断点续跑只重跑受影响段。</div>`;
 }else if(tab==='files'){
  const sel=S.view&&S.view.file?S.view.file:null;
  b.innerHTML=`<div class="dsec">数据与产物 · 点击行预览内容</div><div class="dlist">${FILES.map(f=>`<div class="ditem ${sel===f.name?'on':''}" data-file="${esc(f.name)}" style="${sel===f.name?'background:var(--accent-weak);color:var(--text)':''}"><span class="ic">${ICONS[f.ic]}</span><span class="name">${f.name}</span>${f.hash?`<span class="hash">${f.hash}</span>`:''}<span class="meta">${f.meta}</span>${f.stale?'<span class="st" style="background:var(--stale)" title="STALE"></span>':''}</div>`).join('')}</div>
  ${sel?renderFilePreview(sel):''}
  <div class="dsec">指纹</div><div class="ditem" style="cursor:default;font-size:12px;color:var(--text-2)">每个产物记录 SHA256 前缀与生成命令；参数变更 → 指纹失配 → 标 STALE。点击任意产物行即可在下方预览内容。</div>`;
  b.querySelectorAll('.ditem[data-file]').forEach(d=>d.addEventListener('click',()=>{S.view={file:d.dataset.file};renderDrawer()}));
 }else if(tab==='audit'){
  b.innerHTML=`<div class="dsec">证据阶梯</div>
  <div class="ladder">${['runnable','checked','audited','calibrated','validated','publishable'].map((lv,i)=>`<div class="lv ${i<=4?'on':''}">${lv}</div>`).join('')}</div>
  <div class="dsec">Provenance 树</div><div class="prov-tree" style="background:#fff;border:1px solid var(--border);border-radius:7px;padding:10px 12px">
   <div class="row"><span class="k">产物</span><span class="v">velocity.h5 · 9e12…f0c7</span></div>
   <div class="row"><span class="k">└ 命令</span><span class="v">mintpy_sbas.py --unw ${S.method}_out --update</span></div>
   <div class="row"><span class="k">&nbsp;&nbsp;└ 参数</span><span class="v">params/unwrap.yaml · ${S.method}</span></div>
   <div class="row"><span class="k">&nbsp;&nbsp;&nbsp;└ 输入</span><span class="v">unwrapPhase.h5 · 46 景 SLC</span></div>
  </div>
  <div class="dsec">指标来源契约</div>
  <div style="background:#fff;border:1px solid var(--border);border-radius:7px;padding:10px 12px;font-size:12px;display:flex;flex-direction:column;gap:6px;color:var(--text-2)">
   <div>GNSS 比对：<b style="color:var(--ok)">preferred</b> CGPS 站 ✓ 匹配</div>
   <div>速率外推：<b style="color:var(--ok)">preferred</b> MintPy 反演 ✓ 匹配</div>
   <div>冻融分量：<b style="color:var(--bad)">forbidden</b> 12 天采样 × 硬 gate</div>
  </div>`;
 }else if(tab==='report'){
  b.innerHTML=`<div class="dsec">论文方法草稿</div><div style="background:#fff;border:1px solid var(--border);border-radius:7px;padding:12px;font-size:12.5px;line-height:1.75;color:var(--text-2)"><p><b style="color:var(--text)">2.3 InSAR 时序形变分析</b></p><p style="margin-top:6px">…采用 ISCE2 干涉测量与 MintPy SBAS 反演，解缠方法 MCF<span style="color:var(--accent)">〔prov-6a〕</span>，冻土区 A 年均速率 −23.4 ± 2.1 mm/yr<span style="color:var(--accent)">〔prov-10〕</span>，与 GNSS 相关 0.86，PS/SBAS 一致性 0.92。</p></div>
  <div class="dsec">导出</div><div style="display:flex;gap:8px"><button class="btn primary" style="flex:1;justify-content:center" onclick="toast('已打包 ZIP')">ZIP</button><button class="btn ghost" style="flex:1;justify-content:center" onclick="toast('已导出 Markdown')">.md</button></div>`;
 }else if(tab==='images'){
  const sel=S.view&&S.view.pt?S.view.pt:'A';
  b.innerHTML=`<div class="dsec">产物图件 · 点击查看大图</div>
  <div class="gal">${IMAGES.map(g=>`<div class="gal-item" data-img="${g.id}">
   <div class="gbar">${g.t}<span class="exp" title="全屏查看"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg></span><span class="mono">${g.meta}</span></div>
   <div class="gbody">${imgSvg(g.id)}</div>
   <div class="gdesc"><span class="tag ${g.stale?'stale':''}">${g.stale?'STALE · 待重跑':'有效'}</span>${g.name}<span class="mono" style="font-family:var(--mono);font-size:10px;color:var(--text-3);margin-left:6px">${g.hash}</span></div>
  </div>`).join('')}</div>
  <div class="dsec">地图查看数据 · 点击点位</div>
  <div class="mapview">
   <div class="mv-tool">形变速率 · LOS (mm/yr)<span class="mono">vel_yushu_2023.png</span></div>
   <div class="mapbox">${mapSvg(sel)}</div>
   <div style="padding:8px 10px;display:flex;gap:6px;flex-wrap:wrap;border-top:1px solid var(--bg-hover)">${POINTS.map(p=>`<span class="pointchip ${p.id===sel?'on':''}" data-pt="${p.id}">${p.name}</span>`).join('')}</div>
  </div>
  ${tsCard(sel)}`;
  b.querySelectorAll('.gal-item').forEach(it=>it.addEventListener('click',()=>showLightbox(it.dataset.img)));
  b.querySelectorAll('.mapbox .pt').forEach(p=>p.addEventListener('click',()=>{S.view={pt:p.dataset.id};renderDrawer()}));
  b.querySelectorAll('.pointchip').forEach(c=>c.addEventListener('click',()=>{S.view={pt:c.dataset.pt};renderDrawer()}));
 }else if(tab==='browser'){
  b.innerHTML=renderBrowser();
  b.querySelectorAll('.bmarks .bm').forEach(bm=>bm.addEventListener('click',()=>{S.view={site:bm.dataset.site};renderDrawer()}));
  const go=()=>{const v=$('bUrl').value||'';const site=Object.keys(BROWSER_SITES).find(k=>v.includes({'asf':'asf','esa':'esa','lit':'scholar'}[k])&&{'asf':'asf','esa':'esa','lit':'scholar'}[k]===k)||(v.includes('asf')?'asf':v.includes('esa')?'esa':v.includes('scholar')?'lit':'asf');S.view={site};renderDrawer();toast('内置浏览器 · 已打开 '+v)};
  $('bGo').addEventListener('click',go);
  $('bUrl').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();go()}});
 }
 $('drawerTabs').querySelectorAll('button').forEach(bt=>bt.classList.toggle('on',bt.dataset.tab===tab));
}

/* ============ 会话 & 顶栏 ============ */
const SESSIONS=[
 {id:'yushu-2023', name:'玉树冻土 · SBAS 时序', sub:'ISCE2 + MintPy · 46 景', state:'active'},
 {id:'landslide-2', name:'雅鲁藏布江滑坡监测', sub:'时序分析 · PS 链', state:'idle'},
 {id:'quake-0418', name:'地震同震形变 · 玛多', sub:'干涉图 · 未完成', state:'idle'},
];
function renderSessions(){
 $('slist').innerHTML=SESSIONS.map(s=>`<div class="sitem ${s.id===S.session?'active':''}" data-s="${s.id}"><div class="name">${s.name}</div><div class="sub"><span class="st">${s.id===S.session?'<span class="dot" style="width:7px;height:7px;border-radius:50%;background:var(--accent);display:inline-block"></span>当前':''}</span><span>${s.sub}</span></div></div>`).join('');
 $('slist').querySelectorAll('.sitem').forEach(it=>it.addEventListener('click',()=>{S.session=it.dataset.s;renderSessions();toast('已切换到会话：'+it.querySelector('.name').textContent)}));
}
function setHeaderStatus(kind,txt){
 const b=$('hdrStatus');
 b.className='badge '+(kind==='stale'?'stale':kind==='run'?'run':kind==='ok'?'ok':'');
 $('hdrStatusTxt').textContent=txt;
}

/* ============ 空态 & 演示 ============ */
function renderHero(){
 S.phase='hero';
 chat.innerHTML=`<div class="hero fadein">
  <div class="logo">IA</div>
  <h1>InSAR-Agent</h1>
  <p>用自然语言驱动 InSAR 处理流水线 —— ISCE2 / MintPy / PyStamps 编排、失效检测、证据链、论文级结果。分析研究、搜索资料研究，边聊边出结果。</p>
  <div class="hero-chips">
   <button class="chip" data-demo="1">分析玉树冻土 2020-2023 SBAS 时序</button>
   <button class="chip" data-demo="2">滑坡区 PS 点监测与 GNSS 对比</button>
   <button class="chip" data-demo="3">复现论文 Fig.3 干涉图流程</button>
  </div>
  <div class="hero-hint">选择上方示例，或直接在输入框描述你的研究任务</div>
 </div>`;
 chat.querySelectorAll('.chip').forEach(c=>c.addEventListener('click',()=>startDemo()));
 $('btnReplay').style.display='none';
}
async function startDemo(){
 if(S.phase==='demo')return;
 S.phase='demo';
 S.dirty=false; S.method='3D_FULL';
 STEPS.forEach((s,i)=>{s.stale=false; s.state=i<5?'done':(i===5?'running':undefined)});
 FILES.forEach(f=>{f.stale=false});
 chat.innerHTML='';
 $('btnReplay').style.display='';
 setHeaderStatus('run','规划中');
 msgUser('分析青海玉树冻土 2020-2023 的 SBAS 时序形变');
 await sleep(650);
 const th=msgAgent(el('<div class="text">专家模式 · 场景识别：Sentinel-1 升降轨 46 景 · 冻土区低相干 → 选用 SBAS 链（ISCE2 前置处理 + MintPy 时序反演），计划 11 步。前 5 步产物已就绪，直接进入第 6 步。</div>'),{thinking:true});
 await sleep(500);
 setHeaderStatus('run','运行中');
 const pw=el('<div class="fadein"></div>'); const pc=pipelineCard(); pw.appendChild(pc); msgAgent(pw);
 STEPS.forEach((s,i)=>{ if(i<5)setStepState(s.id,'done'); if(i===5)setStepState(s.id,'running') });
 await sleep(600);
 msgAgent(el(`<div class="text">第 <b>6 步 · 解缠</b> 需要决策：当前配置 <span class="mono">3D_FULL</span> 不可用（本机无 3D 相位解缠工具链，且输出格式与下游时序反演不兼容）。候选集如下，Agent 建议 <b style="color:var(--ok)">MCF</b> —— 冻土低相干区稳健、MintPy 原生兼容。</div>`));
 const cw=el('<div class="fadein"></div>'); const candc=candidateCard(); cw.appendChild(candc); msgAgent(cw);
 await sleep(200);
}
function resetDemo(){
 S.phase='hero'; S.dirty=false; S.method='3D_FULL'; S.ran=false;
 STEPS.forEach((s,i)=>{s.stale=false; s.state=i<5?'done':(i===5?'running':undefined)});
 FILES.forEach(f=>{f.stale=false});
 $('btnRun').style.display='none'; $('railRun').style.display='none';
 setHeaderStatus('','空闲');
 refreshDrawer();
}

/* ============ 事件绑定 ============ */
$('btnSend').addEventListener('click',()=>{const v=$('input').value.trim();if(!v)return;if(S.phase==='hero'){startDemo()}else{msgUser(v);const w=el('<div class="fadein"></div>');w.appendChild(candidateCard());msgAgent(w)};$('input').value=''});
$('input').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('btnSend').click()}});
$('input').addEventListener('input',()=>{$('btnSend').disabled=!$('input').value.trim()});
$('btnRun').addEventListener('click',()=>{if(S.dirty)confirmRun();else{toast('无待重跑变更，直接运行');runPipeline()}});
$('railRun').addEventListener('click',()=>$('btnRun').click());
$('btnReplay').addEventListener('click',()=>{resetDemo();startDemo()});
$('newChat').addEventListener('click',()=>{resetDemo();renderHero()});
$('railChat').addEventListener('click',()=>{resetDemo();renderHero();toast('已回到对话')});
$('railSessions').addEventListener('click',()=>{const sd=$('sider');sd.style.display=sd.style.display==='none'?'':'none'});
$('railPanel').addEventListener('click',()=>{const d=$('drawer');d.classList.toggle('on');if(d.classList.contains('on')){if(!S.drawer)S.drawer='pipeline';renderDrawer()}});
$('drawerTabs').querySelectorAll('button').forEach(bt=>bt.addEventListener('click',()=>{S.drawer=bt.dataset.tab;renderDrawer()}));
$('modeSw').querySelectorAll('button').forEach(bt=>bt.addEventListener('click',()=>{
 $('modeSw').querySelectorAll('button').forEach(x=>x.classList.remove('on'));
 bt.classList.add('on'); S.mode=bt.dataset.mode;
 toast(S.mode==='guide'?'向导模式：Agent 自动决策，关键节点征询确认':'专家模式：手动指定每步方法');
}));
$('ovClose').addEventListener('click',()=>{if(confirm('取消当前处理？已完成的步骤将保留（断点续跑）。')){$('overlay').classList.add('hidden');setHeaderStatus('','已暂停');toast('已取消，可从断点继续')}});
$('lbClose').addEventListener('click',()=>$('lightbox').classList.remove('on'));
$('lbOpenRight').addEventListener('click',()=>{const id=$('lbOpenRight').dataset.img;const g=IMAGES.find(x=>x.id===id);openDrawer('images',g?{img:id}:null);$('lightbox').classList.remove('on')});
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('lightbox').classList.remove('on')});

/* ============ 启动 ============ */
renderSessions(); renderHero();
$('btnSend').disabled=true;
</script>
</body>
</html>
