<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>InSAR-Agent · 失败态卡片静态演示</title>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/stream.css">
<style>
  /* 演示页自身的极简布局（不进组件库）：顶部说明 + 流区块 + 底部输入框 */
  body { display: flex; flex-direction: column; height: 100vh; background: var(--bg); }
  .demo-bar {
    padding: 10px 24px; border-bottom: 1px solid var(--border);
    font-size: 13px; color: var(--text-2); background: var(--surface);
  }
  .demo-bar b { color: var(--text); }
  #stream { flex: 1; }
  .demo-input { padding: 10px 24px 14px; border-top: 1px solid var(--border); background: var(--bg); }
  .demo-input textarea {
    width: 100%; max-width: var(--stream-w); display: block; margin: 0 auto;
    border: 1px solid var(--border-strong); border-radius: var(--r);
    padding: 8px 12px; background: var(--surface); color: var(--text); resize: vertical;
  }
</style>
</head>
<body>

<div class="demo-bar"><b>fail-demo</b> · stream.js 失败态与 Agent UX 卡片静态演示：
  ① 失败卡（P2-003） ② gate_stop 卡（建议可点） ③ 确认后的审批卡（P2-002）
  ④ 无失败上下文的 bad note 对照 ⑤ 只读工具聚合组（失败组展开标红）
  ⑥ 排队消息 chip（可撤销 / flush 逐条发出） ⑦ 审批「不再询问」可撤销。
  数据由本页脚本注入，非真实运行。</div>

<div class="stream" id="stream" role="log" aria-label="演示轨迹流"></div>

<div class="demo-input">
  <label class="sr-only" for="prompt">演示输入框</label>
  <textarea id="prompt" rows="2"
    placeholder="gate_stop 卡的建议点击后会回填到这里（复用 index.html 的 #prompt 约定）"></textarea>
</div>

<script type="module">
  import * as Stream from './js/stream.js';
  import * as Queue from './js/queue.js';
  import { S } from './js/state.js';
  import { toast } from './js/dom.js';

  Stream.mount(document.getElementById('stream'));
  // 演示页没有 dock / app.js：hooks 注入为提示动作，验证按钮接线路径本身
  Stream.setFailureHooks({
    openTerminal: (stepNo) => toast(`演示：切换到 dock 终端面板（第 ${stepNo} 步日志）`),
    resume: () => toast('演示：从断点继续 —— 真实页面复用 app.js 的 resumeRun 入口'),
  });

  /* ---- ① 失败卡（P2-003）：工具卡 exit≠0 → note(tone=bad) ---- */
  Stream.agentMsg('① 失败卡：第 8 步大气校正 ERA5 拉取失败（tool 卡 exit 1 后紧跟 note tone=bad）。',
    '共写入 10 行日志，预览按规则截尾为最后 8 行。');
  const t = Stream.toolCall({
    cmd: 'smallbaselineApp.py --dostep correct_troposphere --method tropo_era5_pyaps',
    verb: '[08/11]', label: '大气校正', open: true,
  });
  [
    ['$ smallbaselineApp.py --dostep correct_troposphere --method tropo_era5_pyaps', 'cmd'],
    ['本地缓存命中 3/7 天 · 需从 CDS 补拉 4 个日期的 ERA5 再分析数据', 'dim'],
    ['CDS 请求已入队 · queue position 12 → 4', 'dim'],
    ['GET https://cds.climate.copernicus.eu/api/v2/… → HTTP 503 Service Unavailable', 'err'],
    ['重试 1/3（指数退避 2s）… HTTP 503', 'warn'],
    ['重试 2/3（指数退避 4s）… HTTP 503', 'warn'],
    ['重试 3/3（指数退避 8s）… HTTP 503', 'err'],
    ['失败分类：service_down（规则命中 r"HTTP 5\\d\\d"，未消耗 LLM 调用）', 'dim'],
    ['✗ ERA5 不可达 · 断点已保留（已下载 0/4 天，无需清理）', 'err'],
    ['wrapper: exit_code=1 · checkpoint.json 已写入', 'dim'],
  ].forEach(([line, tone]) => t.log(line, tone));
  t.finish({ exit: 1, summary: '失败 · service_down（HTTP 503 × 3）' });
  Stream.note('bad',
    '第 8 步失败 · service_down（分诊来源：rule）。处置：换用离线大气模型降级继续，或保留断点等 ERA5 恢复。');

  /* ---- ② gate_stop 卡（服务端文本形态，建议为字符串列表） ---- */
  Stream.agentMsg('② gate_stop 卡：建议列表升级为可点操作，点击回填到底部输入框。');
  Stream.gateStopEntry({
    stepId: 6,
    text: '第 6 步被质量门拦停：unwrap_coverage 0.62 < 0.70，上游解缠质量不足以支撑时序反演。',
    suggestions: [
      '换用其他方法（snaphu_smooth）重跑第 6 步',
      '放宽阈值至 0.60（需在 contract.yaml 里登记依据）',
    ],
  });

  /* ---- ③ 确认后的审批卡（P2-002：紧凑单行完成态） ---- */
  Stream.agentMsg('③ 审批卡：点「确认执行」后是一行紧凑完成态，不再是占满卡片的大号对勾。');
  const card = Stream.askApproval({
    title: '需确认 · 执行流水线',
    rows: [
      ['步骤', '第 6、7、8、9、10、11 步（共 6 步）'],
      ['耗时', '时长未知 · 首次运行此配置'],
      ['花费', '0 元 · 本机计算，未提交云端作业'],
      ['可逆', '仅新增文件，无覆写风险'],
    ],
    actions: [
      { label: '确认执行', icon: 'play', done: '已确认 · 开始执行', run: () => {} },
      { label: '取消', done: '已取消 · 流水线保持待运行', run: () => {} },
    ],
  });
  card.querySelector('.acts button').click();   // 模拟用户点「确认执行」

  /* ---- ④ 对照：无失败上下文的 bad note 仍是普通横幅 ---- */
  Stream.note('bad', '④ 对照：这条 bad note 前面没有失败的工具卡，保持横幅形态（运行时错误等场景）。');

  /* ---- ⑤ 只读工具聚合组：连续探查卡折叠，执行卡不入组，失败组展开标红 ---- */
  Stream.agentMsg('⑤ 聚合组：连续的探查类工具卡（verb 非 [NN/MM]）折叠为「探查 · N 个工具」，',
    '执行步骤卡保持顶层内联；组内任一 exit≠0 → 整组默认展开并标红。');
  const p1 = Stream.toolCall({ cmd: 'runtime/probe.py --engines --wsl', verb: 'probe', label: '探测可用引擎' });
  p1.log('$ probe.py --engines --wsl', 'cmd');
  p1.log('isce2 2.6.5 ✓ · mintpy 1.6.4 ✓ · snaphu 2.0.7 ✓', 'ok');
  p1.finish({ exit: 0, summary: '5 个引擎可用' });
  const p2 = Stream.toolCall({ cmd: 'core/store.py --scan --session ridgecrest-2019', verb: 'inspect', label: '扫描已有产物与指纹' });
  p2.log('hyp3/ 11 对 · 110 文件 · 指纹匹配 ✓ 跳过', 'ok');
  p2.finish({ exit: 0, summary: 'HyP3 已完成 1–5 步' });
  const p3 = Stream.toolCall({ cmd: 'core/thresholds.py --audit', verb: 'inspect', label: '审计质量门阈值' });
  p3.log('corr_threshold 0.85 · local_calibration · PENDING', 'warn');
  p3.finish({ exit: 0, summary: '3 个阈值 PENDING' });

  // 执行步骤卡（[06/11]）打断连续段，保持顶层内联；产物徽章可点（真实页跳转 dock 面板）
  const s6 = Stream.toolCall({ cmd: 'snaphu.py --method mcf --threads 8', verb: '[06/11]', label: '解缠' });
  s6.log('$ snaphu.py --method mcf --threads 8', 'cmd');
  s6.log('✓ data/unw/*.unw · 74 MB', 'ok');
  s6.finish({ exit: 0, summary: '完成 · 94.2% 像元已解缠', artifacts: [
    { path: 'data/unw/20190622_20190704.unw', hash: '4f21…9ac3' },
    { path: 'products/velocities/vel_ridgecrest_2019.png', hash: '08b3…77aa' },
  ], onArtifact: (p) => toast(`演示：真实页面里图像产物切「影像」面板，其余切「文件」面板（${p}）`) });

  // 第二段连续探查，其中一张失败 → 整组默认展开并标红
  const p4 = Stream.toolCall({ cmd: 'runtime/probe.py --credentials', verb: 'probe', label: '检查服务凭据' });
  p4.log('earthdata ✓ · cds ✗ 凭据过期', 'warn');
  p4.finish({ exit: 0, summary: '1/3 凭据可用' });
  const p5 = Stream.toolCall({ cmd: 'net/cds_ping.py --timeout 8', verb: 'probe', label: '探测 CDS 可达性' });
  p5.log('GET https://cds.climate.copernicus.eu → HTTP 503 Service Unavailable', 'err');
  p5.finish({ exit: 7, summary: '失败 · service_down' });

  /* ---- ⑥ 排队消息 chip：busy 期间输入不丢弃，可撤销，flush 逐条发出 ---- */
  Stream.agentMsg('⑥ 排队消息 chip：busy 期间回车 → 消息入队，输入框上方出现可撤销 chip；',
    '回合结束（app.js 的 setBusy(false) 时机）逐条自动发出。点下方按钮模拟一次「回合结束」。');
  Queue.enqueue('把第 8 步大气校正换成 GACOS 再跑一遍');
  Queue.enqueue('顺便导出 GeoTIFF 给 GIS 用');
  Stream.note('info', '演示：每点一次按钮 = 一次回合结束（flush），最旧的一条排队消息以用户消息形态发进流。', [
    { label: '模拟回合结束（flush）', kind: 'btn-pri',
      run: () => { Queue.count() ? Queue.flush((t) => Stream.userMsg(t)) : toast('队列已空：先在下方输入框排点消息？本演示页任何时刻回车都会入队'); } },
  ]);

  /* ---- ⑦ 审批「不再询问」可撤销：自动通过的 note 带撤销链接 ---- */
  Stream.agentMsg('⑦ 审批「不再询问」可撤销：同指纹族审批自动通过时，note 上有「撤销该记忆」链接，',
    '点击清除记忆并 toast 确认，下次同类操作会重新弹审批卡。');
  S.autoApprove.add('pipeline-run:create');
  Stream.askApproval({
    title: '需确认 · 执行流水线',
    family: 'pipeline-run:create',
    rows: [['步骤', '第 6–11 步（共 6 步）'], ['花费', '0 元 · 本机计算']],
    actions: [
      { label: '确认执行', icon: 'play', done: '已确认 · 开始执行', run: () => {} },
      { label: '取消', done: '已取消', run: () => {} },
    ],
  });

  // 演示页的输入框也接上排队语义：回车即入队（体验 chip 的撤销交互）
  document.getElementById('prompt').addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      Queue.enqueue(e.target.value);
    }
  });
</script>

</body>
</html>
