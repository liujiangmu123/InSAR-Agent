[project]
name = "insar-agent"
version = "0.1.0"
description = "InSAR processing agent with a reproducibility contract (stale detection / provenance / step-level resume)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# 栅格校验与真实 qa/出图(run_ok 的 NaN 检查、engines/qa.py、engines/figures.py 宿主回退)。
# matplotlib 默认由引擎 conda 环境提供,故不在此声明;需宿主直接出图时另行安装。
raster = ["numpy>=1.26", "h5py>=3.10"]
# MCP server 薄包装(src/insar_agent/mcp):官方 python SDK + HTTP 客户端。
# mcp>=2.0:高层 API 为 MCPServer(1.x FastMCP 的更名后继,导入路径不同,不兼容)。
mcp = ["mcp>=2.0", "httpx>=0.27"]
dev = [
    "pytest>=8.0", "httpx>=0.27", "hypothesis>=6.100",
    # 质检工具链:ruff 静态检查门禁 / pip-audit 依赖漏洞审计
    "ruff>=0.16",
    "pip-audit>=2.10",
]

[project.scripts]
# MCP server 入口(等价 python -m insar_agent.mcp;需安装可选组 [mcp])
insar-agent-mcp = "insar_agent.mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
insar_agent = ["core/schema.sql", "audit/contract.yaml", "runtime/wsl_wrapper.sh", "registry/scenario_packs/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# basetemp 指向项目内目录:本机 %TEMP% 的 pytest 根目录存在 ACL 损坏(WinError 5)
addopts = "-q --basetemp=.pytest_tmp"
markers = [
    # 时序敏感用例:判定窗依赖真实时钟(心跳/双超时/宽限/租约老化/流式收尾),
    # 高负载机器上设 INSAR_TEST_TIME_FACTOR=3 放宽判定窗(conftest.TIME_FACTOR);
    # CI 中与常规用例分 job:常规 -m "not timing",timing 单独串行跑(ci.yml)
    "timing: 时序敏感(真实时钟判定窗;负载下用 INSAR_TEST_TIME_FACTOR 放宽)",
    "slow: 慢用例,快速回归可用 -m 'not slow' 排除",
]

[tool.ruff]
# 行宽对齐仓库现状:绝大多数行 <= 100(全仓最长 112,超 100 的约 30 行按告警清单管理,
# 不为清零而改写既有代码);不启用 ruff format,避免全仓格式化大 diff
line-length = 100
target-version = "py311"
# src 布局的一方包识别(isort 分组用)
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
# 保守规则集:pycodestyle 错误/警告(E/W)+ pyflakes(F)+ import 排序(I)
select = ["E", "F", "W", "I"]

[tool.ruff.lint.isort]
known-first-party = ["insar_agent"]

[tool.ruff.lint.per-file-ignores]
# conftest 先插 sys.path 再 import 一方包是刻意设计(支持不安装直接跑测试),
# 其后的模块级 import 允许不在文件顶部
"tests/conftest.py" = ["E402"]
# mcp 是可选依赖组:pytest.importorskip 必须先于 mcp 相关 import(未装则整文件跳过)
"tests/test_mcp_server.py" = ["E402"]
